mapper:
  ros__parameters:
    map_frame: odom          # the simulator's odometry is perfect, so odom works as the map frame
    resolution: 0.05         # metres per cell
    width_m: 12.0
    height_m: 12.0
    origin_x: -1.0           # world position of cell (0, 0)
    origin_y: -1.0
    p_hit: 0.7
    p_miss: 0.4
    max_use_range: 5.0
    process_every_n_scans: 2
    publish_period: 1.0
    map_dir: ~/maps
    map_name: sim_world
